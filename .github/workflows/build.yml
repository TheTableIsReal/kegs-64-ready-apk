name: Build KEGS 64-bit

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK r21e
        run: |
          # Устанавливаем нужную версию NDK напрямую через менеджер SDK
          sdkmanager --install "ndk;21.4.7075529"
          # Прописываем путь к NDK в настройки проекта, чтобы Gradle его увидел
          echo "ndk.dir=$ANDROID_HOME/ndk/21.4.7075529" > local.properties

      - name: Force 64-bit ARM Architecture
        run: |
          if [ -f project.properties ]; then
            echo "ndk.abis := armeabi-v7a arm64-v8a" >> project.properties
          fi
          find . -name "Application.mk" | while read file; do
            echo "APP_ABI := armeabi-v7a arm64-v8a" > "$file"
          done

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload 64-bit APK
        uses: actions/upload-artifact@v4
        with:
          name: kegs-64bit-emulator
          path: '**/build/outputs/apk/**/*.apk'
          
