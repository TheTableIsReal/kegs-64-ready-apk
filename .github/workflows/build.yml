name: Build KEGS 64-bit

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 # Используем старую ОС для совместимости со старым NDK

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8' # Эмулятору нужна именно старая Java 8

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '21.4.7075529' # Устанавливаем NDK для сборки C-кода эмулятора

      - name: Force 64-bit ARM Architecture
        run: |
          # Включаем компиляцию под 64-битные процессоры (arm64-v8a)
          if [ -f project.properties ]; then
            echo "ndk.abis := armeabi-v7a arm64-v8a" >> project.properties
          fi
          find . -name "Application.mk" | while read file; do
            echo "APP_ABI := armeabi-v7a arm64-v8a" > "$file"
           Cav

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload 64-bit APK
        uses: actions/upload-artifact@v4
        with:
          name: kegs-64bit-emulator
          path: '**/build/outputs/apk/**/*.apk'
          
